name: Docker ref build
description: Builds a docker image for a ref reference (branch or tag)

inputs:
  registry: { required: true }
  platforms: { required: true }
  docker-compose-context: { required: true }
  docker-compose-file-name: { required: true }
  target-service:
    required: false
    default: ""
  image-base: { required: true }
  image-description: { required: true }
  ref-sha: { required: true }
  tags: { required: true }
  push-attestations: { required: true }
  sbom-file: { required: true }
  push-latest: { required: false, default: "false" }

  # Cache controls
  cache-enabled: { required: false, default: "true" }
  cache-mode:
    required: false
    default: "auto" # auto|min|max ; auto => max on stable semver tags, min otherwise
  cache-ignore-error: { required: false, default: "true" }
  cache-scope:
    required: false
    default: "" # optional override. default computed as: <repo>-<target>-<ref>

outputs:
  digest:
    value: ${{ steps.digest.outputs.digest }}
  labels:
    value: ${{ steps.meta.outputs.labels }}
  image-base:
    value: ${{ inputs.image-base }}
  subject:
    value: ${{ steps.subject.outputs.subject }}

runs:
  using: composite
  steps:
    - name: Loads docker compose properties
      id: compose-metadata
      uses: vionix-proj/actions/docker/compose/metadata@main
      with:
        compose-path: ${{ inputs.docker-compose-file-name }}
        target-service: ${{ inputs.target-service }}

    - name: Verify bake targets from compose file
      shell: bash
      id: verify
      run: |
        set -euo pipefail
        echo "Using compose file: ${{ inputs.docker-compose-file-name }}"
        test -f "${{ inputs.docker-compose-file-name }}" || (echo "::error::Compose file not found"; ls -la; exit 1)
        docker buildx version
        docker buildx bake -f "${{ inputs.docker-compose-file-name }}" --print
        if [[ "${{ inputs.push-latest }}" == "true" ]]; then
          echo "flavor-latest=true" >> "$GITHUB_OUTPUT"
        else
          echo "flavor-latest=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

    - name: Set up Buildx
      id: buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

    - name: Login to GHCR
      uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Rewrite compose images to GHCR only
      shell: bash
      working-directory: ${{ inputs.docker-compose-context }}
      env:
        GHCR_IMAGE_BASE: ${{ inputs.image-base }}
        FILE: ${{ inputs.docker-compose-file-name }}
      run: |
        set -euo pipefail
        python - <<'PY'
        import os, re
        path = os.environ["FILE"]
        ghcr = os.environ["GHCR_IMAGE_BASE"]
        with open(path, "r", encoding="utf-8") as f:
          s = f.read()
        s2, n = re.subn(r'(?m)^(?P<indent>\s*)image:\s*.+$', r'\g<indent>image: ' + ghcr, s)
        with open(path, "w", encoding="utf-8") as f:
          f.write(s2)
        print(f"Rewrote {n} image field(s) in {path}")
        PY

    - name: Docker metadata - labels only
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
      with:
        images: ${{ inputs.image-base }}
        labels: |
          org.opencontainers.image.title=${{ github.event.repository.name }}
          org.opencontainers.image.description=${{ inputs.image-description }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        flavor: latest=${{ steps.verify.outputs.flavor-latest }}

    - name: Build tag override lines
      id: tag_overrides
      shell: bash
      env:
        TARGET: ${{ steps.compose-metadata.outputs.target-service }}
        REF_TAG: ${{ github.ref_name }}
        REF_SHA: ${{ inputs.ref-sha }}
        PUSH_LATEST: ${{ inputs.push-latest }}
        INPUT_TAGS: ${{ inputs.tags }}
        IMAGE_BASE: ${{ inputs.image-base }}
      run: |
        set -euo pipefail
        {
          echo "lines<<EOF"
          # inputs.tags can be multiline; each line is a full image ref
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            echo "${TARGET}.tags=${t}"
          done <<< "${INPUT_TAGS}"

          # Always add an immutable tag for the supplied commit SHA
          echo "${TARGET}.tags=${IMAGE_BASE}:${REF_SHA}"

          # add latest only on stable semver tags and when requested
          if [[ "${PUSH_LATEST}" == "true" ]] && [[ "${REF_TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "${TARGET}.tags=${IMAGE_BASE}:latest"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Resolve cache policy
      id: cache
      shell: bash
      env:
        CACHE_ENABLED: ${{ inputs.cache-enabled }}
        CACHE_MODE_INPUT: ${{ inputs.cache-mode }}
        CACHE_SCOPE_INPUT: ${{ inputs.cache-scope }}
        TARGET: ${{ steps.compose-metadata.outputs.target-service }}
        REPO: ${{ github.repository }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        if [[ "${CACHE_ENABLED}" != "true" ]]; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "enabled=true" >> "$GITHUB_OUTPUT"

        case "${CACHE_MODE_INPUT}" in
          auto)
            if [[ "${REF_NAME}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              MODE="max"
            else
              MODE="min"
            fi
            ;;
          min|max)
            MODE="${CACHE_MODE_INPUT}"
            ;;
          *)
            MODE="min"
            ;;
        esac

        SCOPE="${CACHE_SCOPE_INPUT:-${REPO}-${TARGET}-${REF_NAME}}"

        echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
        echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"

    - name: Build and push (cache enabled)
      if: ${{ steps.cache.outputs.enabled == 'true' }}
      id: bake_cache
      uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad
      with:
        files: |
          ${{ inputs.docker-compose-file-name }}
          ${{ steps.meta.outputs.bake-file-labels }}
        targets: ${{ steps.compose-metadata.outputs.target-service }}
        push: true
        builder: ${{ steps.buildx.outputs.name }}
        set: |
          ${{ steps.compose-metadata.outputs.target-service }}.platform=${{ inputs.platforms }}
          ${{ steps.tag_overrides.outputs.lines }}
          ${{ steps.compose-metadata.outputs.target-service }}.cache-from=type=gha,scope=${{ steps.cache.outputs.scope }}
          ${{ steps.compose-metadata.outputs.target-service }}.cache-to=type=gha,mode=${{ steps.cache.outputs.mode }},scope=${{ steps.cache.outputs.scope }},ignore-error=${{ inputs.cache-ignore-error }}

    - name: Build and push (cache disabled)
      if: ${{ steps.cache.outputs.enabled != 'true' }}
      id: bake_nocache
      uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad
      with:
        files: |
          ${{ inputs.docker-compose-file-name }}
          ${{ steps.meta.outputs.bake-file-labels }}
        targets: ${{ steps.compose-metadata.outputs.target-service }}
        push: true
        builder: ${{ steps.buildx.outputs.name }}
        set: |
          ${{ steps.compose-metadata.outputs.target-service }}.platform=${{ inputs.platforms }}
          ${{ steps.tag_overrides.outputs.lines }}

    - name: Resolve image digest
      id: digest
      shell: bash
      env:
        TARGET_SERVICE: ${{ steps.compose-metadata.outputs.target-service }}
        META_JSON_CACHE: ${{ steps.bake_cache.outputs.metadata }}
        META_JSON_NOCACHE: ${{ steps.bake_nocache.outputs.metadata }}
      run: |
        set -euo pipefail

        META_JSON="${META_JSON_CACHE:-$META_JSON_NOCACHE}"

        DIGEST=$(printf '%s' "$META_JSON" | jq -r --arg t "$TARGET_SERVICE" '.[$t]["containerimage.digest"] // .["containerimage.digest"] // empty')
        if [ -z "$DIGEST" ]; then
          echo "::error::Digest not found in bake metadata"
          exit 1
        fi
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

    - name: Resolve subject
      id: subject
      shell: bash
      env:
        IMAGE_BASE: ${{ inputs.image-base }}
        DIGEST: ${{ steps.digest.outputs.digest }}
      run: |
        set -euo pipefail
        echo "subject=${IMAGE_BASE}@${DIGEST}" >> "$GITHUB_OUTPUT"

    - name: Attest build provenance
      uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8
      with:
        subject-name: ${{ inputs.image-base }}
        subject-digest: ${{ steps.digest.outputs.digest }}
        push-to-registry: ${{ inputs.push-attestations }}
        show-summary: true

    - name: Generate SBOM
      uses: anchore/sbom-action@v0.17.3
      with:
        image: ${{ inputs.image-base }}@${{ steps.digest.outputs.digest }}
        output-file: ${{ inputs.sbom-file }}

    - name: Attest SBOM
      uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6
      with:
        subject-name: ${{ inputs.image-base }}
        subject-digest: ${{ steps.digest.outputs.digest }}
        sbom-path: ${{ inputs.sbom-file }}
        push-to-registry: ${{ inputs.push-attestations }}
        show-summary: true
