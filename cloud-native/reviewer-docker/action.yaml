name: "Docker Build Reviewer - Anthropic"
description: "Reviews pull requests that change Dockerfiles, Docker Compose files, and related Docker build inputs using Anthropic."
author: "vionix-platform"

branding:
  icon: "box"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token used to read PR files/checks and create/update PR comments."
    required: false
    default: ${{ github.token }}

  anthropic-api-key:
    description: "Anthropic API key."
    required: true

  anthropic-base-url:
    description: "Anthropic API base URL."
    required: false
    default: "https://api.anthropic.com"

  anthropic-version:
    description: "Anthropic API version header."
    required: false
    default: "2023-06-01"

  anthropic-models:
    description: "Comma-separated Anthropic models to try in order."
    required: false
    default: "claude-opus-4-6,claude-sonnet-4-6,claude-haiku-4-5"

  anthropic-max-tokens:
    description: "Maximum tokens for the Anthropic response."
    required: false
    default: "1800"

  anthropic-temperature:
    description: "Temperature for the Anthropic request."
    required: false
    default: "0.2"

  anthropic-request-timeout-seconds:
    description: "curl max-time for each Anthropic API request."
    required: false
    default: "120"

  max-attempts-per-model:
    description: "Maximum retry attempts per model."
    required: false
    default: "5"

  initial-retry-sleep-seconds:
    description: "Initial retry sleep duration. Doubles after each failed attempt."
    required: false
    default: "3"

  pr-body-max-chars:
    description: "Maximum number of PR body characters to include in the Anthropic prompt."
    required: false
    default: "8000"

  docker-patches-max-chars:
    description: "Maximum number of Docker-related patch characters to include in the Anthropic prompt."
    required: false
    default: "24000"

  all-files-max-chars:
    description: "Maximum number of changed-file list characters to include in the Anthropic prompt."
    required: false
    default: "8000"

  docker-file-pattern-regex:
    description: "JavaScript regex used to identify Docker-related files changed by the PR."
    required: false
    default: "(^|/)(Dockerfile([._-].*)?|.*\\.Dockerfile|Containerfile([._-].*)?|.*\\.Containerfile|docker-compose([._-].*)?\\.ya?ml|compose([._-].*)?\\.ya?ml|\\.dockerignore)$"

  require-docker-changes:
    description: "If true, skip the reviewer when no Docker-related files are changed."
    required: false
    default: "true"

  include-ci-signal:
    description: "If true, gather legacy commit statuses and check runs for the PR head SHA."
    required: false
    default: "true"

  publish-summary:
    description: "If true, publish the generated review to the GitHub Actions job summary."
    required: false
    default: "true"

  post-comment:
    description: "If true, create or update a PR comment with the generated review."
    required: false
    default: "true"

  update-existing-comment:
    description: "If true, update an existing bot comment containing the comment marker instead of creating a new comment."
    required: false
    default: "true"

  comment-marker:
    description: "Marker used to find an existing PR comment to update."
    required: false
    default: "## 🐳 Docker Build Review"

  review-title:
    description: "Markdown heading used at the top of the generated review."
    required: false
    default: "## 🐳 Docker Build Review"

  extra-prompt:
    description: "Additional instructions appended to the Anthropic review prompt."
    required: false
    default: ""

  fail-on-anthropic-error:
    description: "If true, fail the action when all Anthropic model attempts fail. If false, publish a fallback review."
    required: false
    default: "false"

outputs:
  should-run:
    description: "Whether the action is running in a supported pull request event."
    value: ${{ steps.guard.outputs.should_run }}

  should-review:
    description: "Whether Docker-related changes were found or review was forced."
    value: ${{ steps.relevance.outputs.should_review }}

  docker-file-count:
    description: "Number of Docker-related changed files detected."
    value: ${{ steps.docker-files.outputs.docker_file_count }}

  docker-files:
    description: "Newline-separated Docker-related changed files."
    value: ${{ steps.docker-files.outputs.docker_files }}

  review-body-path:
    description: "Path to the generated review markdown file."
    value: ${{ steps.paths.outputs.review_body_path }}

  ai-opinion-path:
    description: "Path to the generated AI opinion markdown file."
    value: ${{ steps.paths.outputs.ai_opinion_path }}

  review-body:
    description: "Generated review body."
    value: ${{ steps.final.outputs.review_body }}

  anthropic-success:
    description: "Whether the Anthropic reviewer returned a successful response."
    value: ${{ steps.anthropic-review.outputs.success }}

  anthropic-model:
    description: "Anthropic model that produced the successful response."
    value: ${{ steps.anthropic-review.outputs.model }}

runs:
  using: "composite"

  steps:
    - name: Determine whether reviewer should run
      id: guard
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail

        should_run="true"

        if [[ "${EVENT_NAME}" != "pull_request" && "${EVENT_NAME}" != "pull_request_target" ]]; then
          echo "This action only supports pull_request or pull_request_target events."
          should_run="false"
        fi

        echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"

    - name: Prepare workspace paths
      id: paths
      if: ${{ steps.guard.outputs.should_run == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        workdir="${RUNNER_TEMP}/docker-build-reviewer-anthropic"
        mkdir -p "${workdir}"

        echo "workdir=${workdir}" >> "${GITHUB_OUTPUT}"
        echo "review_body_path=${workdir}/review.md" >> "${GITHUB_OUTPUT}"
        echo "ai_opinion_path=${workdir}/ai-opinion.md" >> "${GITHUB_OUTPUT}"
        echo "prompt_path=${workdir}/ai-prompt.txt" >> "${GITHUB_OUTPUT}"

    - name: Gather Docker-related PR changes
      id: docker-files
      if: ${{ steps.guard.outputs.should_run == 'true' }}
      uses: actions/github-script@v9.0.0
      env:
        DOCKER_FILE_PATTERN_REGEX: ${{ inputs.docker-file-pattern-regex }}
        DOCKER_PATCHES_MAX_CHARS: ${{ inputs.docker-patches-max-chars }}
        ALL_FILES_MAX_CHARS: ${{ inputs.all-files-max-chars }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const pull_number = context.payload.pull_request.number;
          const { owner, repo } = context.repo;

          const dockerPattern = new RegExp(process.env.DOCKER_FILE_PATTERN_REGEX, 'i');
          const dockerPatchMaxChars = Number(process.env.DOCKER_PATCHES_MAX_CHARS || 24000);
          const allFilesMaxChars = Number(process.env.ALL_FILES_MAX_CHARS || 8000);

          function truncate(value, maxChars) {
            const text = String(value || '');
            if (text.length <= maxChars) return text;
            return `${text.slice(0, maxChars)}\n\n...[truncated ${text.length - maxChars} chars]`;
          }

          const files = await github.paginate(github.rest.pulls.listFiles, {
            owner,
            repo,
            pull_number,
            per_page: 100,
          });

          const dockerFiles = files.filter(file => dockerPattern.test(file.filename));

          const allChangedFilesMarkdown = truncate(
            files.map(file => `- ${file.status}: ${file.filename} (+${file.additions}/-${file.deletions})`).join('\n'),
            allFilesMaxChars,
          );

          const dockerPatchesMarkdown = truncate(
            dockerFiles.map(file => {
              const patch = file.patch || '_No patch available from GitHub API. The file may be too large, binary, renamed without textual diff, or generated._';
              return [
                `### ${file.filename}`,
                `- Status: ${file.status}`,
                `- Additions: ${file.additions}`,
                `- Deletions: ${file.deletions}`,
                `- Changes: ${file.changes}`,
                '',
                '```diff',
                patch,
                '```',
              ].join('\n');
            }).join('\n\n'),
            dockerPatchMaxChars,
          );

          core.setOutput('changed_file_count', String(files.length));
          core.setOutput('docker_file_count', String(dockerFiles.length));
          core.setOutput('docker_files', dockerFiles.map(file => file.filename).join('\n'));
          core.setOutput('all_changed_files_markdown', allChangedFilesMarkdown || '_No changed files returned by GitHub API._');
          core.setOutput('docker_patches_markdown', dockerPatchesMarkdown || '_No Docker-related file patches detected._');

    - name: Determine Docker review relevance
      id: relevance
      if: ${{ steps.guard.outputs.should_run == 'true' }}
      shell: bash
      env:
        REQUIRE_DOCKER_CHANGES: ${{ inputs.require-docker-changes }}
        DOCKER_FILE_COUNT: ${{ steps.docker-files.outputs.docker_file_count }}
      run: |
        set -euo pipefail

        should_review="true"

        if [[ "${REQUIRE_DOCKER_CHANGES}" == "true" && "${DOCKER_FILE_COUNT:-0}" == "0" ]]; then
          echo "Skipping Docker build review because no Docker-related files were changed."
          should_review="false"
        fi

        echo "should_review=${should_review}" >> "${GITHUB_OUTPUT}"

    - name: Gather CI signal for PR head SHA
      id: ci
      if: ${{ steps.guard.outputs.should_run == 'true' && steps.relevance.outputs.should_review == 'true' && inputs.include-ci-signal == 'true' }}
      uses: actions/github-script@v9.0.0
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const sha = context.payload.pull_request.head.sha;
          const { owner, repo } = context.repo;

          let state = 'unknown';
          let total = 0;
          let checkTotal = 0;
          let checkFailed = 0;

          try {
            const statusResp = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: sha,
            });

            state = statusResp.data.state || 'unknown';
            total = Array.isArray(statusResp.data.statuses)
              ? statusResp.data.statuses.length
              : 0;
          } catch (e) {
            core.warning(`Failed to get combined status: ${e.message}`);
          }

          try {
            const checksResp = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
              per_page: 100,
            });

            const checkRuns = checksResp.data.check_runs || [];
            checkTotal = checksResp.data.total_count ?? checkRuns.length;

            const failingConclusions = new Set([
              'failure',
              'timed_out',
              'cancelled',
              'startup_failure',
            ]);

            checkFailed = checkRuns.filter(run =>
              failingConclusions.has(run.conclusion)
            ).length;
          } catch (e) {
            core.warning(`Failed to get check runs: ${e.message}`);
          }

          core.setOutput('status_state', state);
          core.setOutput('status_total', String(total));
          core.setOutput('check_total', String(checkTotal));
          core.setOutput('check_failed', String(checkFailed));

    - name: Build base review body
      if: ${{ steps.guard.outputs.should_run == 'true' && steps.relevance.outputs.should_review == 'true' }}
      shell: bash
      env:
        REVIEW_MD: ${{ steps.paths.outputs.review_body_path }}
        REVIEW_TITLE: ${{ inputs.review-title }}
        DOCKER_FILE_COUNT: ${{ steps.docker-files.outputs.docker_file_count }}
        DOCKER_FILES: ${{ steps.docker-files.outputs.docker_files }}
        CHANGED_FILE_COUNT: ${{ steps.docker-files.outputs.changed_file_count }}
        CI_STATE: ${{ steps.ci.outputs.status_state }}
        CI_TOTAL: ${{ steps.ci.outputs.status_total }}
        CHECK_TOTAL: ${{ steps.ci.outputs.check_total }}
        CHECK_FAILED: ${{ steps.ci.outputs.check_failed }}
      run: |
        set -euo pipefail

        python3 <<'PY'
        import os

        review_md = os.environ['REVIEW_MD']
        docker_files = os.environ.get('DOCKER_FILES', '').strip()
        docker_file_list = docker_files if docker_files else '_No Docker-related files detected._'

        content = f"""{os.environ.get('REVIEW_TITLE', '## 🐳 Docker Build Review')}

        ### Docker review context
        - **Changed files**: `{os.environ.get('CHANGED_FILE_COUNT', '0')}` total
        - **Docker-related files**: `{os.environ.get('DOCKER_FILE_COUNT', '0')}`
        - **Commit status**: `{os.environ.get('CI_STATE') or 'unknown'}`
        - **Legacy statuses**: `{os.environ.get('CI_TOTAL') or '0'}`
        - **Check runs**: `{os.environ.get('CHECK_TOTAL') or '0'}` total, `{os.environ.get('CHECK_FAILED') or '0'}` failed

        ### Docker-related files reviewed
        ```text
        {docker_file_list}
        ```

        ### 1) Docker build/process review scope
        - Dockerfile, Containerfile, Docker Compose, and `.dockerignore` changes are reviewed for build correctness, reproducibility, cache behavior, security, and runtime/build configuration drift.
        - This reviewer uses PR metadata, changed file names, Docker-related diffs, and CI/check signal. It does **not** claim to execute `docker build`, `docker compose build`, or runtime containers.

        """

        with open(review_md, 'w', encoding='utf-8') as handle:
            handle.write(content)
        PY

    - name: Build Anthropic Docker review prompt
      id: prompt
      if: ${{ steps.guard.outputs.should_run == 'true' && steps.relevance.outputs.should_review == 'true' }}
      shell: bash
      env:
        PROMPT_PATH: ${{ steps.paths.outputs.prompt_path }}
        PR_BODY_MAX_CHARS: ${{ inputs.pr-body-max-chars }}
        EXTRA_PROMPT: ${{ inputs.extra-prompt }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        REPO: ${{ github.repository }}
        DOCKER_FILE_COUNT: ${{ steps.docker-files.outputs.docker_file_count }}
        DOCKER_FILES: ${{ steps.docker-files.outputs.docker_files }}
        CHANGED_FILE_COUNT: ${{ steps.docker-files.outputs.changed_file_count }}
        ALL_CHANGED_FILES_MARKDOWN: ${{ steps.docker-files.outputs.all_changed_files_markdown }}
        DOCKER_PATCHES_MARKDOWN: ${{ steps.docker-files.outputs.docker_patches_markdown }}
        CI_STATE: ${{ steps.ci.outputs.status_state }}
        CI_TOTAL: ${{ steps.ci.outputs.status_total }}
        CHECK_TOTAL: ${{ steps.ci.outputs.check_total }}
        CHECK_FAILED: ${{ steps.ci.outputs.check_failed }}
      run: |
        set -euo pipefail

        python3 <<'PY'
        import os

        prompt_path = os.environ['PROMPT_PATH']
        pr_body_max_chars = int(os.environ.get('PR_BODY_MAX_CHARS') or '8000')
        pr_body_raw = os.environ.get('PR_BODY') or ''
        pr_body_trunc = pr_body_raw[:pr_body_max_chars]
        extra_prompt = os.environ.get('EXTRA_PROMPT') or ''

        prompt = f"""You are reviewing a pull request for Docker build and Docker Compose changes.

        REPO: {os.environ.get('REPO')}
        PR NUMBER: {os.environ.get('PR_NUMBER')}
        PR TITLE: {os.environ.get('PR_TITLE')}
        BASE REF: {os.environ.get('PR_BASE_REF')}
        HEAD REF: {os.environ.get('PR_HEAD_REF')}
        HEAD SHA: {os.environ.get('PR_HEAD_SHA')}
        PR BODY truncated to {pr_body_max_chars} chars:
        {pr_body_trunc}

        CHANGE SUMMARY
        - Changed files total: {os.environ.get('CHANGED_FILE_COUNT') or '0'}
        - Docker-related files count: {os.environ.get('DOCKER_FILE_COUNT') or '0'}

        DOCKER-RELATED FILES
        ```text
        {os.environ.get('DOCKER_FILES') or '_No Docker-related files detected._'}
        ```

        ALL CHANGED FILES
        {os.environ.get('ALL_CHANGED_FILES_MARKDOWN') or '_No changed files returned by GitHub API._'}

        DOCKER-RELATED PATCHES
        {os.environ.get('DOCKER_PATCHES_MARKDOWN') or '_No Docker-related patches detected._'}

        CI SIGNALS
        - Commit status state: {os.environ.get('CI_STATE') or 'unknown'}
        - Legacy statuses count: {os.environ.get('CI_TOTAL') or '0'}
        - Check runs total: {os.environ.get('CHECK_TOTAL') or '0'}
        - Check runs failed: {os.environ.get('CHECK_FAILED') or '0'}

        REVIEW FOCUS
        Be very focused on the Docker build process and Docker Compose correctness. Review only what can be inferred from the PR metadata, changed file names, diffs, and CI signal. Do not claim that you ran Docker commands.

        Analyze the following areas when applicable:
        1) Dockerfile / Containerfile build correctness
           - Base image choice, mutable tags vs digest pinning, platform/architecture implications.
           - Multi-stage build structure, stage naming, target stages, copied artifacts, and missing build outputs.
           - `ARG` and `ENV` usage, build-time vs runtime configuration, default values, and accidental secret exposure.
           - `COPY`/`ADD` paths relative to build context, ordering for cache efficiency, and missing files suggested by the diff.
           - Package manager commands, cache cleanup, non-deterministic installs, version pinning, and BuildKit-only syntax.
           - `USER`, file ownership, permissions, working directory, entrypoint/cmd behavior, healthcheck, exposed ports.
           - Layer caching, reproducibility, image size, and build performance.

        2) Docker Compose correctness
           - `build.context`, `dockerfile`, `target`, `args`, `additional_contexts`, and paths relative to the compose file.
           - Service image/build consistency, tags, pull/build behavior, profiles, depends_on, healthchecks, ports, networks, volumes.
           - Environment variables, env_file handling, secrets/configs, and accidental credential leakage.
           - Runtime/build drift between compose service definitions and Dockerfile expectations.

        3) `.dockerignore` and build context hygiene
           - Missing `.dockerignore`, overly broad/overly narrow ignores, leaked secrets, bloated build contexts, excluded files needed by COPY.

        4) CI/build risk
           - Use the check/status signal to assess whether the Docker build is currently protected by CI.
           - If CI does not appear to run `docker build`, `docker compose config`, `docker compose build`, image scanning, or integration smoke tests, recommend targeted follow-up validation.

        OUTPUT FORMAT
        Return markdown only with these sections:
        - Risk level: LOW | MEDIUM | HIGH
        - Recommendation: PASS | HOLD | INVESTIGATE
        - Docker build findings: concise bullets, grouped by severity
        - Docker Compose findings: concise bullets, grouped by severity, or state "not applicable"
        - `.dockerignore` / build context findings: concise bullets, or state "not applicable"
        - CI/build validation gaps
        - Next actions

        Be specific. Reference exact file paths when possible. If a concern is speculative because only diffs were available, label it as "verify" rather than stating it as fact.
        """

        if extra_prompt.strip():
            prompt += f"""

        ADDITIONAL REVIEW INSTRUCTIONS:
        {extra_prompt}
        """

        with open(prompt_path, 'w', encoding='utf-8') as handle:
            handle.write(prompt)
        PY

        delimiter="docker_review_prompt_$(date +%s%N)"
        {
          echo "prompt<<${delimiter}"
          cat "${PROMPT_PATH}"
          echo "${delimiter}"
        } >> "${GITHUB_OUTPUT}"

    - name: AI Docker build impact review
      id: anthropic-review
      if: ${{ steps.guard.outputs.should_run == 'true' && steps.relevance.outputs.should_review == 'true' }}
      uses: vionix-proj/actions/ai/anthropic/claude-codereviewer@main
      with:
        anthropic-api-key: ${{ inputs.anthropic-api-key }}
        anthropic-base-url: ${{ inputs.anthropic-base-url }}
        anthropic-version: ${{ inputs.anthropic-version }}
        anthropic-models: ${{ inputs.anthropic-models }}
        anthropic-max-tokens: ${{ inputs.anthropic-max-tokens }}
        anthropic-temperature: ${{ inputs.anthropic-temperature }}
        anthropic-request-timeout-seconds: ${{ inputs.anthropic-request-timeout-seconds }}
        max-attempts-per-model: ${{ inputs.max-attempts-per-model }}
        initial-retry-sleep-seconds: ${{ inputs.initial-retry-sleep-seconds }}
        fail-on-anthropic-error: ${{ inputs.fail-on-anthropic-error }}
        output-file: ${{ steps.paths.outputs.ai_opinion_path }}
        prompt: ${{ steps.prompt.outputs.prompt }}

    - name: Append AI opinion to unified review
      if: ${{ steps.guard.outputs.should_run == 'true' && steps.relevance.outputs.should_review == 'true' }}
      shell: bash
      env:
        REVIEW_MD: ${{ steps.paths.outputs.review_body_path }}
        AI_OPINION_PATH: ${{ steps.paths.outputs.ai_opinion_path }}
      run: |
        set -euo pipefail

        {
          echo "### 2) AI Docker build risk opinion"
          echo

          if [[ -s "${AI_OPINION_PATH}" ]]; then
            cat "${AI_OPINION_PATH}"
          else
            echo "_Skipped: AI opinion not generated._"
          fi
        } >> "${REVIEW_MD}"

    - name: Publish job summary
      if: ${{ steps.guard.outputs.should_run == 'true' && steps.relevance.outputs.should_review == 'true' && inputs.publish-summary == 'true' }}
      shell: bash
      env:
        REVIEW_MD: ${{ steps.paths.outputs.review_body_path }}
      run: |
        set -euo pipefail
        cat "${REVIEW_MD}" >> "${GITHUB_STEP_SUMMARY}"

    - name: Upsert PR comment
      if: ${{ steps.guard.outputs.should_run == 'true' && steps.relevance.outputs.should_review == 'true' && inputs.post-comment == 'true' }}
      uses: actions/github-script@v9.0.0
      env:
        REVIEW_MD: ${{ steps.paths.outputs.review_body_path }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
        UPDATE_EXISTING_COMMENT: ${{ inputs.update-existing-comment }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');

          const body = fs.readFileSync(process.env.REVIEW_MD, 'utf8');
          const marker = process.env.COMMENT_MARKER;
          const updateExisting = process.env.UPDATE_EXISTING_COMMENT === 'true';

          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
            per_page: 100,
          });

          const existing = comments.find(comment =>
            comment.user?.type === 'Bot' &&
            comment.body &&
            comment.body.includes(marker)
          );

          if (existing && updateExisting) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }

    - name: Expose final outputs
      id: final
      if: ${{ steps.guard.outputs.should_run == 'true' && steps.relevance.outputs.should_review == 'true' }}
      shell: bash
      env:
        REVIEW_MD: ${{ steps.paths.outputs.review_body_path }}
      run: |
        set -euo pipefail

        delimiter="review_body_$(date +%s%N)"

        {
          echo "review_body<<${delimiter}"
          cat "${REVIEW_MD}"
          echo "${delimiter}"
        } >> "${GITHUB_OUTPUT}"
